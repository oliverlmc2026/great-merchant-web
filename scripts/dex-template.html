<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>__LABEL__</title>
<script src="./support.js"></script>
<script src="./highlight.js"></script>
<script src="./page-search.js"></script>
<script src="./__KEY__-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14181c;font-family:'Noto Sans TC',sans-serif;color:#e8e4da}
a{color:#c9a24b}a:hover{color:#e8e4da}
</style>
</helmet>
<div style="width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:56px 56px 96px;display:flex;flex-direction:column;gap:32px;background:#14181c">
  <nav id="page-nav" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;height:44px;background:#14181c"><a href="Main.dc.html" style="font-size:15px;font-weight:700">← 回到目錄</a></nav>
  <div id="page-search-slot" style="position:sticky;top:44px;z-index:29;height:52px;box-sizing:border-box;padding-bottom:8px;background:#14181c"></div>
  <header style="display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #3a444c;padding-bottom:28px">
    <div style="font-size:14px;letter-spacing:0.3em;color:#c9a24b;font-weight:700">__LABEL__</div>
    <h1 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:56px;line-height:1.1">{{cur.name}}</h1>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#8a949b">__BLURB__ 內容整理自個人知識庫。</p>
  </header>

  <sc-if value="{{qs.on}}" hint-placeholder-val="{{ false }}">
    <div style="position:sticky;top:96px;z-index:28;display:flex;flex-direction:column;gap:10px;padding-bottom:8px;background:#14181c">
      <input type="search" value="{{qs.q}}" onInput="{{qs.onQ}}" placeholder="搜尋任務：中文或英文名，例如 探險千年湖、Wind from the West" aria-label="搜尋任務" style="min-height:52px;box-sizing:border-box;padding:0 18px;border-radius:8px;border:1px solid #c9a24b;background:#1c2328;color:#e8e4da;font-family:inherit;font-size:17px;outline:none">
      <sc-if value="{{qs.hasQ}}" hint-placeholder-val="{{ false }}">
        <div style="font-size:14px;color:#8a949b">{{qs.sum}}</div>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto">
          <sc-for list="{{qs.hits}}" as="h" hint-placeholder-count="3">
            <button onClick="{{h.go}}" style="display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-height:48px;box-sizing:border-box;padding:10px 16px;border:1px solid #2c353c;border-radius:6px;background:#1c2328;text-align:left;font-family:inherit;cursor:pointer">
              <span style="font-size:15px;font-weight:700;color:#e8e4da">{{h.title}}</span>
              <span style="font-size:14px;color:#aab2b8">{{h.en}}</span>
              <span style="margin-left:auto;font-size:13px;color:#c9a24b">{{h.where}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <div id="page-tabs" style="{{tabBox}}">
    <sc-for list="{{cats}}" as="k" hint-placeholder-count="1">
      <div style="display:flex;flex-direction:column;gap:10px;{{k.sep}}">
        <sc-if value="{{k.hasName}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px">
            <button onClick="{{k.toggle}}" style="display:flex;align-items:center;gap:8px;min-height:44px;padding:0;border:0;background:none;font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600;color:#c9a24b;cursor:pointer"><span style="font-size:14px;width:14px;color:#8a949b">{{k.arrow}}</span>{{k.name}}</button>
            <span style="font-size:13px;color:#8a949b">{{k.note}}</span>
          </div>
        </sc-if>
        <sc-if value="{{k.open}}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{k.tabs}}" as="t" hint-placeholder-count="13">
              <button onClick="{{t.pick}}" style="min-height:44px;padding:0 14px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid {{t.border}};background:{{t.bg}};color:{{t.fg}}">{{t.label}}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{cur.empty}}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;font-size:16px;color:#aab2b8">此頁在原匯出檔入面冇內容。</p>
  </sc-if>

  <sc-if value="{{noData}}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;font-size:16px;color:#d2553a">資料未能載入。</p>
  </sc-if>

  <div id="page-content" style="display:flex;flex-direction:column;gap:18px;scroll-margin-top:172px">
    <sc-if value="{{cur.hasMeta}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;background:#1f2b33;border:1px solid #33505f;border-radius:8px;font-size:17px;font-weight:700;color:#e8e4da">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#c9a24b" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span>當前地區：{{cur.name}}<span style="color:#5d6a73;margin:0 10px">|</span>{{cur.meta}}</span>
      </div>
    </sc-if>
    <sc-for list="{{cur.groups}}" as="g" hint-placeholder-count="3">
      <section id="{{g.id}}" style="scroll-margin-top:172px;display:flex;flex-direction:column;gap:12px;padding:20px;background:#1c2328;border:1px solid #2c353c;border-radius:8px">
        <sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{ true }}">
          <h2 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:600;font-size:22px;color:#e8e4da">{{g.title}}</h2>
        </sc-if>
        <div style="overflow-x:auto;border:1px solid #2c353c;border-radius:6px">
          <div style="display:flex;flex-direction:column;gap:1px;background:#2c353c;min-width:{{g.minW}}px">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <div style="display:grid;grid-template-columns:{{g.cols}};gap:1px">
                <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
                  <div style="min-width:0;box-sizing:border-box;background:{{r.bg}};padding:8px 12px;font-size:14px;line-height:1.7;color:{{r.fg}};font-weight:{{r.fw}};display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <sc-for list="{{c.imgs}}" as="im" hint-placeholder-count="1"><img src="{{im}}" alt="" loading="lazy" style="height:{{g.imgH}}px;width:auto;max-width:100%;border-radius:4px;background:#0e1114"></sc-for>
                    <span style="white-space:pre-line;overflow-wrap:anywhere;min-width:0">{{c.t}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p) { super(p); const D = (typeof window !== 'undefined' && window.UNITS_DATA) || []; const idx = () => Math.max(0, D.findIndex((x) => x.name === decodeURIComponent(location.hash.slice(1)))); this.state = { i: idx(), shut: {}, q: '' }; window.addEventListener('hashchange', () => this.setState({ i: idx() })); }
  renderVals() {
    const D = (typeof window !== 'undefined' && window.UNITS_DATA) ? window.UNITS_DATA : [];
    const i = Math.min(this.state.i, Math.max(0, D.length - 1));
    // tabs with a `cat` are shown in collapsible category blocks (not pinned); pages without one keep the single pinned row
    const grouped = D.some((x) => x.cat);
    const tabs = D.map((x, j) => ({ name: x.name, label: x.label || x.name, cat: x.cat || '', note: x.catNote || '',
      pick: () => { location.hash = encodeURIComponent(x.name); if (grouped) document.getElementById('page-content').scrollIntoView({ behavior: 'smooth' }); },
      bg: j === i ? '#d2553a' : '#1c2328', fg: j === i ? '#14181c' : '#e8e4da', border: j === i ? '#d2553a' : '#3a444c' }));
    const cats = [];
    tabs.forEach((t) => { let k = cats[cats.length - 1]; if (!k || k.name !== t.cat) { k = { name: t.cat, note: t.note, tabs: [] }; cats.push(k); } k.tabs.push(t); });
    cats.forEach((k, j) => { const open = !this.state.shut[k.name]; Object.assign(k, { hasName: !!k.name, open, arrow: open ? '▾' : '▸',
      sep: j ? 'border-top:1px solid #2c353c;padding-top:14px' : '',
      toggle: () => this.setState({ shut: { ...this.state.shut, [k.name]: open } }) }); });
    // quest search (grouped pages): match every space-separated term against step title, English name or region
    const q = this.state.q.trim().toLowerCase();
    const terms = q.split(/\s+/).filter(Boolean);
    const hits = [];
    if (grouped && terms.length) D.forEach((x, j) => x.groups.forEach((g, gi) => {
      if (!g.en) return;
      const s = (g.title + ' ' + g.en + ' ' + x.name).toLowerCase();
      if (terms.every((t) => s.includes(t))) hits.push({ title: g.title.replace(/^\d+\.\s*/, ''), en: g.en, where: x.name,
        go: () => { this.setState({ q: '' }); location.hash = encodeURIComponent(x.name); setTimeout(() => { const el = document.getElementById('g' + gi); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 50); } });
    }));
    const qs = { on: grouped, q: this.state.q, hasQ: terms.length > 0, onQ: (e) => this.setState({ q: e.target.value }),
      sum: hits.length ? '搵到 ' + hits.length + ' 個任務' + (hits.length > 50 ? '（只顯示頭 50 個）' : '') : '搵唔到相符任務，試下用較短嘅關鍵字。',
      hits: hits.slice(0, 50) };
    const tabBox = grouped
      ? 'display:flex;flex-direction:column;gap:14px;padding:8px 0 20px;border-bottom:1px solid #2c353c'
      : 'position:sticky;top:96px;z-index:28;display:flex;flex-direction:column;padding:8px 0;background:#14181c;max-height:34vh;overflow-y:auto;border-bottom:1px solid #2c353c';
    const P = D[i] || { name: '', groups: [] };
    const groups = P.groups.map((g, gi) => {
      const n = Math.max(...g.rows.map((r) => r.length));
      const w = [];
      for (let c = 0; c < n; c++) {
        let m = 2, img = false;
        g.rows.slice(0, 60).forEach((r) => { const x = r[c]; if (!x) return; if (x.i.length) img = true; m = Math.max(m, Math.min(x.t.length, 70)); });
        w.push(img && m <= 2 ? 56 : Math.max(48, Math.min(m * 14 + 24, 520)));
      }
      const single = !g.th && n === 1;
      return {
        id: 'g' + gi, title: g.title, hasTitle: !!g.title,
        cols: single ? 'minmax(0,1fr)' : w.map((x) => 'minmax(' + Math.min(x, 260) + 'px,' + x + 'fr)').join(' '),
        minW: single ? 0 : Math.min(w.reduce((a, b) => a + Math.min(b, 260), 0), 1700),
        imgH: 40,
        rows: g.rows.map((r, k) => {
          const hdr = g.th && k === 0;
          return { bg: hdr ? '#2a343b' : '#181e22', fg: hdr ? '#c9a24b' : '#c3c9ce', fw: hdr ? 700 : 400,
            cells: r.map((c) => ({ t: c.t, imgs: c.i.map((f) => '__IMG__' + f) })) };
        })
      };
    });
    return { qs, cats, tabBox, cur: { name: P.name, meta: P.meta || '', hasMeta: !!P.meta, groups, empty: groups.length === 0 }, noData: D.length === 0 };
  }
}
</script>
</body>
</html>
