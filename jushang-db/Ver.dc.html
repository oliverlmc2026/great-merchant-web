<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>版本與公告</title>
<script src="./support.js"></script>
<script src="./highlight.js"></script>
<script src="./Ver-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14181c;font-family:'Noto Sans TC',sans-serif;color:#e8e4da}
a{color:#c9a24b}a:hover{color:#e8e4da}
</style>
</helmet>
<div style="width:100%;max-width:1280px;margin:0 auto;box-sizing:border-box;padding:56px 56px 96px;display:flex;flex-direction:column;gap:32px;background:#14181c">
  <nav><a href="Main.dc.html" style="font-size:15px;font-weight:700">← 回到目錄</a></nav>
  <header style="display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #3a444c;padding-bottom:28px">
    <div style="font-size:14px;letter-spacing:0.3em;color:#c9a24b;font-weight:700">版本與公告</div>
    <h1 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:900;font-size:56px;line-height:1.1">{{cur.name}}</h1>
    <p style="margin:0;font-size:15px;line-height:1.7;color:#8a949b">內容同圖片按原頁表格逐行整理，數值同文字照原頁抄錄。</p>
  </header>

  <div style="display:flex;flex-wrap:wrap;gap:8px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="13">
      <button onClick="{{t.pick}}" style="min-height:44px;padding:0 14px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:1px solid {{t.border}};background:{{t.bg}};color:{{t.fg}}">{{t.name}}</button>
    </sc-for>
  </div>

  <sc-if value="{{cur.empty}}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;font-size:16px;color:#aab2b8">此頁在原匯出檔入面冇內容。</p>
  </sc-if>

  <sc-if value="{{noData}}" hint-placeholder-val="{{ false }}">
    <p style="margin:0;font-size:16px;color:#d2553a">資料未能載入。</p>
  </sc-if>

  <div style="display:flex;flex-direction:column;gap:18px">
    <sc-for list="{{cur.groups}}" as="g" hint-placeholder-count="3">
      <section style="display:flex;flex-direction:column;gap:12px;padding:20px;background:#1c2328;border:1px solid #2c353c;border-radius:8px">
        <sc-if value="{{g.hasHead}}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
            <sc-for list="{{g.head}}" as="c" hint-placeholder-count="3">
              <div style="flex:1 1 {{c.basis}}px;min-width:0;display:flex;flex-direction:column;gap:8px">
                <sc-for list="{{c.imgs}}" as="im" hint-placeholder-count="1"><img src="{{im}}" alt="" style="width:{{c.imgW}}px;max-width:100%;height:auto;border:1px solid #3a444c;border-radius:6px;background:#0e1114"></sc-for>
                <div style="font-size:15px;line-height:1.75;color:#e8e4da;white-space:pre-line;overflow-wrap:anywhere">{{c.t}}</div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:1px;background:#2c353c;border:1px solid #2c353c;border-radius:6px;overflow:hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="display:flex;flex-wrap:wrap;gap:1px">
              <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
                <div style="flex:1 1 {{r.basis}}px;min-width:0;box-sizing:border-box;background:#181e22;padding:10px 12px;font-size:14px;line-height:1.7;color:#c3c9ce;display:flex;flex-direction:column;gap:6px">
                  <sc-for list="{{c.imgs}}" as="im" hint-placeholder-count="1"><img src="{{im}}" alt="" style="width:{{c.imgW}}px;max-width:100%;height:auto;border-radius:4px;background:#0e1114"></sc-for>
                  <span style="white-space:pre-line;overflow-wrap:anywhere">{{c.t}}</span>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <sc-if value="{{cur.hasExtra}}" hint-placeholder-val="{{ false }}">
    <section style="display:flex;flex-direction:column;gap:12px;padding:20px;background:#1c2328;border:1px solid #2c353c;border-radius:8px">
      <h2 style="margin:0;font-size:14px;letter-spacing:0.2em;color:#c9a24b">原頁浮動圖片</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">
        <sc-for list="{{cur.extra}}" as="im" hint-placeholder-count="4"><img src="{{im}}" alt="" style="width:100%;height:auto;border:1px solid #3a444c;border-radius:6px;background:#0e1114"></sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(p) { super(p); const D = (typeof window !== 'undefined' && window.UNITS_DATA) || []; const idx = () => Math.max(0, D.findIndex((x) => x.name === decodeURIComponent(location.hash.slice(1)))); this.state = { i: idx() }; window.addEventListener('hashchange', () => this.setState({ i: idx() })); }
  renderVals() {
    const D = (typeof window !== 'undefined' && window.UNITS_DATA) ? window.UNITS_DATA : [];
    const i = Math.min(this.state.i, Math.max(0, D.length - 1));
    const tabs = D.map((x, j) => ({ name: x.name, pick: () => { location.hash = encodeURIComponent(x.name); },
      bg: j === i ? '#d2553a' : '#1c2328', fg: j === i ? '#14181c' : '#e8e4da', border: j === i ? '#d2553a' : '#3a444c' }));
    const P = D[i] || { name: '', groups: [], extra: [] };
    const cellOf = (c, w) => ({ t: c.t, imgs: c.i.map((n) => ((window.UNITS_IMG && window.UNITS_IMG[n]) || ('img/' + n))), imgW: w, basis: 180 });
    const groups = P.groups.map((g) => {
      const head = !g.pre ? g.rows[0] : null;
      const rest = g.pre ? g.rows : g.rows.slice(1);
      return {
        hasHead: !!head,
        head: head ? head.map((c) => cellOf(c, c.i.length > 1 ? 140 : 120)).map((c, k) => Object.assign(c, { basis: k === 0 && c.imgs.length ? 140 : (c.t.length > 120 ? 280 : 180) })) : [],
        rows: rest.map((r) => ({ basis: r.length >= 8 ? 56 : (r.length >= 5 ? 110 : 170), cells: r.map((c) => cellOf(c, 96)) }))
      };
    });
    const cur = { name: P.name, groups, extra: (P.extra || []).map((n) => ((window.UNITS_IMG && window.UNITS_IMG[n]) || ('img/' + n))), hasExtra: !!(P.extra && P.extra.length), empty: groups.length === 0 && !(P.extra && P.extra.length) };
    return { tabs, cur, noData: D.length === 0 };
  }
}
</script>
</body>
</html>
