name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-search-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild search index
        run: node scripts/build-search-index.js
      - name: Fail if search-data.js is stale
        run: |
          if ! git diff --exit-code --stat -- jushang-db/search-data.js; then
            echo "::error file=jushang-db/search-data.js::Search index is out of date. Run 'node scripts/build-search-index.js' and commit jushang-db/search-data.js."
            exit 1
          fi

  deploy:
    needs: check-search-index
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: jushang-db
      - id: deployment
        uses: actions/deploy-pages@v4
